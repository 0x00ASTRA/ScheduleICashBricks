name: Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Verify version and release notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/release.py --check --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/release.py --check
          fi
      - name: Check Python syntax
        run: python3 -m compileall -q scripts assets/blender
      - name: Test release validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test cash conservation and station transactions
        run: dotnet run --project tests/CashRulesTests.csproj --configuration Release -p:NuGetAudit=false
